version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shorts_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]

  bull-board:
    image: deadly0/bull-board
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["3030:3000"]
    depends_on:
      redis:
        condition: service_healthy

  clip-worker:
    build: ../../services/clip-worker
    env_file:
      - ../../services/clip-worker/.env
    environment:
      API_BASE_URL: http://host.docker.internal:3001/api/v1
      REDIS_HOST: redis
    ports: ["8002:8002"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  transcription-worker:
    build: ../../services/transcription-worker
    env_file:
      - ../../services/transcription-worker/.env
    environment:
      API_BASE_URL: http://host.docker.internal:3001/api/v1
    ports: ["8001:8001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  render-worker:
    build: ../../services/render-worker
    env_file:
      - ../../services/render-worker/.env
    environment:
      API_BASE_URL: http://host.docker.internal:3001/api/v1
    ports: ["8003:8003"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  publish-worker:
    build: ../../services/publish-worker
    env_file:
      - ../../services/publish-worker/.env
    environment:
      API_BASE_URL: http://host.docker.internal:3001/api/v1
    ports: ["8004:8004"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
